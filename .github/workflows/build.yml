name: Build and Release Podoae

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev mingw-w64 wget tar

      - name: Build Linux Binary
        run: |
          chmod +x build.sh
          ./build.sh
          cp podoae podoae-linux

      - name: Download & Extract SDL2 MinGW (for Windows build)
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-devel-2.30.3-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.3-mingw.tar.gz

      - name: Build Windows Binary
        run: |
          x86_64-w64-mingw32-gcc -Wall -Wextra -IInclude -ISDL2-2.30.3/x86_64-w64-mingw32/include -DPODOAE_VERSION="\"${{ env.VERSION }}\"" main.c podoae.c Include/microui/microui.c Include/renderer/renderer.c -LSDL2-2.30.3/x86_64-w64-mingw32/lib -lmingw32 -lSDL2main -lSDL2 -lopengl32 -o podoae.exe
          cp SDL2-2.30.3/x86_64-w64-mingw32/bin/SDL2.dll .

      - name: Upload Linux Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: podoae-linux-x64
          path: podoae-linux

      - name: Upload Windows Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: podoae-windows-x64
          path: |
            podoae.exe
            SDL2.dll

      - name: Check if Release Exists
        id: check_release
        run: |
          git fetch --tags
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.VERSION }} already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_ENV
          else
            echo "Tag v${{ env.VERSION }} does not exist. Proceeding with release."
            echo "should_release=true" >> $GITHUB_ENV
          fi

      - name: Tag and Create GitHub Release
        if: env.should_release == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
          
          gh release create "v${{ env.VERSION }}" \
            podoae-linux \
            podoae.exe \
            SDL2.dll \
            --title "Release v${{ env.VERSION }}" \
            --notes "Automated release for version v${{ env.VERSION }}"
