name: Build Podoae

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev build-essential

      - name: Build Linux Binary
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podoae-linux-x64
          path: podoae

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wget tar zip build-essential

      - name: Download & Extract SDL2 MinGW
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-devel-2.30.3-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.3-mingw.tar.gz

      - name: Build Windows Binary
        run: |
          x86_64-w64-mingw32-gcc -Wall -Wextra -IInclude -ISDL2-2.30.3/x86_64-w64-mingw32/include main.c pomodoro.c Include/microui/microui.c Include/renderer/renderer.c -LSDL2-2.30.3/x86_64-w64-mingw32/lib -lmingw32 -lSDL2main -lSDL2 -lopengl32 -o podoae.exe
          cp SDL2-2.30.3/x86_64-w64-mingw32/bin/SDL2.dll .
          zip podoae-windows-x64.zip podoae.exe SDL2.dll README.md

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podoae-windows-x64
          path: podoae-windows-x64.zip
